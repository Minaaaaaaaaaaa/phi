<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F9F9F7">
<title>Phi</title>
<script>
  // Boot: record the saved tab on <html> before any stylesheet or markup is
  // parsed, so the very first paint already shows the right view (see the
  // :root[data-tab] rules in style.css). Runs synchronously and depends on
  // nothing else -- no defer/async, no SDK. It only marks which tab is active;
  // all data loading and rendering still happens after DOMContentLoaded.
  (function () {
    var tab = 'today';
    try {
      var saved = localStorage.getItem('activeTab');
      if (saved === 'weekly') saved = 'monthly'; // migrate the old tab name
      if (saved === 'today' || saved === 'projects' || saved === 'monthly') tab = saved;
    } catch (e) {
      // Storage unavailable (private mode, blocked cookies) -- keep the default.
    }
    document.documentElement.setAttribute('data-tab', tab);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Login screen (hidden until the auth check resolves with no session) -->
<div class="login-screen hidden" id="login-screen">
  <div class="login-inner">
    <div class="login-logo">φ Phi</div>
    <button class="google-btn" id="google-login-btn">Google로 시작하기</button>
  </div>
</div>

<!-- Loading overlay (shown on first paint until the auth check resolves) -->
<div class="loading-overlay show" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<!-- Web-only top nav -->
<nav class="top-nav" id="top-nav">
  <div class="top-nav-inner">
    <div class="top-nav-logo">φ Phi</div>
    <div class="top-nav-links">
      <a data-tab="today" class="active">오늘</a>
      <a data-tab="projects">프로젝트</a>
      <a data-tab="monthly">먼슬리</a>
    </div>
  </div>
</nav>

<div class="app">
  <!-- Today view. No hardcoded .active: the boot script's <html data-tab>
       decides the initial view, and applyTabClasses() takes over after that. -->
  <div class="view" id="today-view">
    <div class="header">
      <div>
        <h1 class="header-title">Today</h1>
        <div class="header-date" id="today-date"></div>
      </div>
    </div>
    <div id="today-content"></div>
  </div>

  <!-- Projects view -->
  <div class="view" id="projects-view">
    <div class="header">
      <div>
        <h1 class="header-title">Projects</h1>
        <div class="header-date" id="projects-subtitle"></div>
        <a class="logout-link" id="logout-link">로그아웃</a>
      </div>
      <button class="icon-btn" id="new-project-btn" aria-label="New project">+</button>
    </div>
    <div id="projects-content"></div>
  </div>

  <!-- Monthly view (Google Calendar-style grid) -->
  <div class="view" id="monthly-view">
    <div class="month-header">
      <h1 class="header-title" id="month-title"></h1>
      <div class="month-nav-group">
        <button class="month-nav" data-month-nav="-1" aria-label="Previous month">‹</button>
        <button class="month-nav" data-month-nav="1" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="month-card">
      <div class="month-weekdays" id="month-weekdays"></div>
      <div class="month-grid" id="month-grid"></div>
    </div>
  </div>

  <!-- Pomodoro (only visible on Today) -->
  <div class="pomodoro" id="pomodoro" style="display:none;">
    <div class="pomo-info">
      <div class="pomo-label" id="pomo-label">Focus</div>
      <div class="pomo-task" id="pomo-task">No task selected</div>
    </div>
    <div class="pomo-timer-group">
      <button class="pomo-adjust" id="pomo-minus" aria-label="Decrease duration">−</button>
      <div class="pomo-timer" id="pomo-timer">25:00</div>
      <button class="pomo-adjust" id="pomo-plus" aria-label="Increase duration">+</button>
    </div>
    <button class="pomo-btn" id="pomo-btn" aria-label="Start">▶</button>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="projects">Projects</button>
    <button class="tab-btn" data-tab="monthly">Monthly</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Overlay + sheets -->
<div class="overlay" id="overlay"></div>

<!-- New project sheet -->
<div class="sheet" id="new-project-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">New project</div>
    <button class="sheet-close" data-close>Cancel</button>
  </div>
  <div class="sheet-body">
    <label class="input-label">Project name</label>
    <input class="input-field" id="np-name" placeholder="e.g. Learn Spanish" autocomplete="off">

    <label class="input-label">Color</label>
    <div class="color-swatches" id="np-color-swatches"></div>
  </div>
  <div class="sheet-footer">
    <button class="primary-btn" id="np-save">Save project</button>
  </div>
</div>

<!-- Add from projects sheet -->
<div class="sheet" id="picker-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Add to today</div>
    <button class="sheet-close" data-close>Done</button>
  </div>
  <div class="sheet-body" id="picker-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
