<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F9F9F7">
<title>Phi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Login screen (shown until authenticated) -->
<div class="login-screen" id="login-screen">
  <div class="login-inner">
    <div class="login-logo">φ Phi</div>
    <button class="google-btn" id="google-login-btn">Google로 시작하기</button>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<!-- Web-only top nav -->
<nav class="top-nav" id="top-nav">
  <div class="top-nav-inner">
    <div class="top-nav-logo">φ Phi</div>
    <div class="top-nav-links">
      <a data-tab="today" class="active">오늘</a>
      <a data-tab="projects">프로젝트</a>
      <a data-tab="weekly">위클리</a>
    </div>
  </div>
</nav>

<div class="app">
  <!-- Today view -->
  <div class="view active" id="today-view">
    <div class="header">
      <div>
        <h1 class="header-title">Today</h1>
        <div class="header-date" id="today-date"></div>
      </div>
    </div>
    <div id="today-banners"></div>
    <div id="today-content"></div>
  </div>

  <!-- Projects view -->
  <div class="view" id="projects-view">
    <div class="header">
      <div>
        <h1 class="header-title">Projects</h1>
        <div class="header-date" id="projects-subtitle"></div>
        <a class="logout-link" id="logout-link">로그아웃</a>
      </div>
      <button class="icon-btn" id="new-project-btn" aria-label="New project">+</button>
    </div>
    <div id="projects-content"></div>
  </div>

  <!-- Weekly view -->
  <div class="view" id="weekly-view">
    <div class="cal-header">
      <button class="weekly-nav" data-week-nav="-1" aria-label="Previous week">‹</button>
      <div class="cal-range" id="weekly-range"></div>
      <button class="weekly-nav" data-week-nav="1" aria-label="Next week">›</button>
    </div>

    <div class="cal-settings">
      <span class="cal-settings-label">하루 시작</span>
      <div class="cal-start-pills" id="cal-start-pills">
        <button data-start="0">0시</button>
        <button data-start="4">4시</button>
        <button data-start="5">5시</button>
        <button data-start="6" class="active">6시</button>
        <button data-start="7">7시</button>
        <button data-start="8">8시</button>
      </div>
    </div>

    <div class="cal-sticky-top">
      <div class="cal-day-header" id="cal-day-header"></div>
    </div>

    <div class="cal-body" id="cal-body"></div>
  </div>

  <!-- Pomodoro (only visible on Today) -->
  <div class="pomodoro" id="pomodoro" style="display:none;">
    <div class="pomo-info">
      <div class="pomo-label" id="pomo-label">Focus</div>
      <div class="pomo-task" id="pomo-task">No task selected</div>
    </div>
    <div class="pomo-timer-group">
      <button class="pomo-adjust" id="pomo-minus" aria-label="Decrease duration">−</button>
      <div class="pomo-timer" id="pomo-timer">25:00</div>
      <button class="pomo-adjust" id="pomo-plus" aria-label="Increase duration">+</button>
    </div>
    <button class="pomo-btn" id="pomo-btn" aria-label="Start">▶</button>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="projects">Projects</button>
    <button class="tab-btn" data-tab="weekly">Weekly</button>
  </div>
</div>

<!-- Project color picker popup -->
<div class="color-picker-popup" id="color-picker">
  <div class="color-picker-title">프로젝트 색상 변경</div>
  <div class="color-swatches" id="color-swatches"></div>
</div>

<!-- Session detail popup -->
<div class="session-tooltip" id="session-tooltip"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Overlay + sheets -->
<div class="overlay" id="overlay"></div>

<!-- New project sheet -->
<div class="sheet" id="new-project-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">New project</div>
    <button class="sheet-close" data-close>Cancel</button>
  </div>
  <div class="sheet-body">
    <label class="input-label">Project name</label>
    <div class="np-name-row">
      <input class="input-field" id="np-name" placeholder="e.g. Learn Spanish" autocomplete="off">
      <div class="np-date-wrap" id="np-date-wrap">
        <button class="np-cal-btn" id="np-cal-btn" aria-label="Set finish date">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </button>
        <span class="np-date-label" id="np-date-label"></span>
      </div>
    </div>

    <label class="input-label">Buffer (give yourself breathing room)</label>
    <div class="buffer-pills" id="np-buffer-pills">
      <button class="buffer-pill" data-buffer="3">+3 days</button>
      <button class="buffer-pill active" data-buffer="7">+1 week</button>
      <button class="buffer-pill" data-buffer="14">+2 weeks</button>
    </div>
    <div class="buffer-note" id="np-buffer-note">Pick a finish date to see your buffer.</div>

    <label class="input-label">Sub-tasks</label>
    <div id="np-subtasks"></div>
    <button class="add-subtask-row" id="np-add-subtask">+ Add task</button>
  </div>
  <div class="sheet-footer">
    <button class="primary-btn" id="np-save">Save project</button>
  </div>
</div>

<!-- Add from projects sheet -->
<div class="sheet" id="picker-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Add to today</div>
    <button class="sheet-close" data-close>Done</button>
  </div>
  <div class="sheet-body" id="picker-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
